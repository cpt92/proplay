<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a1a"/>
      <stop offset="100%" stop-color="#0b1a3a"/>
    </linearGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e63946"/>
      <stop offset="100%" stop-color="#ff6b78"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#e63946" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#e63946" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Logo -->
  <g transform="translate(80, 80)">
    <rect width="80" height="80" rx="18" fill="url(#brand)"/>
    <path d="M40 14l7.6 15.4 17 2.5-12.3 12 2.9 16.9L40 53l-15.2 7.8 2.9-16.9-12.3-12 17-2.5L40 14z" fill="white"/>
  </g>
  <text x="180" y="135" font-family="Inter, sans-serif" font-size="34" font-weight="800" fill="white">
    PlayWithAStar
  </text>

  <!-- Headline -->
  <text x="80" y="320" font-family="Inter, sans-serif" font-size="92" font-weight="800" fill="white">
    Hire a pro athlete
  </text>
  <text x="80" y="420" font-family="Inter, sans-serif" font-size="92" font-weight="800" fill="url(#brand)">
    for the day.
  </text>

  <!-- Tagline -->
  <text x="80" y="490" font-family="Inter, sans-serif" font-size="28" fill="#94a3b8">
    Golf, hockey, training, and more — real stars, in person.
  </text>

  <!-- URL -->
  <text x="80" y="580" font-family="Inter, sans-serif" font-size="22" font-weight="600" fill="#e63946">
    playwithastar.com
  </text>
</svg>
